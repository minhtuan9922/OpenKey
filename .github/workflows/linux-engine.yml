name: Linux engine

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libfcitx5core-dev ${{ matrix.compiler }}

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build/linux -G Ninja -DOPENKEY_WARNINGS_AS_ERRORS=ON -DOPENKEY_BUILD_FCITX5=ON

      - name: Build
        run: cmake --build build/linux

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

  package-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install package build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build dpkg-dev libfcitx5core-dev

      - name: Build, test and validate DEB
        run: bash scripts/build-linux-deb.sh

      - name: Upload Ubuntu 24.04 package
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-openkey-ubuntu-24.04-amd64
          path: |
            dist/linux/*.deb
            dist/linux/*.deb.sha256
          if-no-files-found: error
